server:
  port: 8080

spring:
  application:
    name: api-gateway
  servlet:
    multipart:
      max-file-size: 70MB
      max-request-size: 70MB
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:8083/oauth2/jwks}
  cloud:
    gateway:
      # ==========================================
      # GLOBAL CORS CONFIGURATION
      # ==========================================
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:5173"  # Vite React default
              - "http://localhost:3000"  # Create-React-App default
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowed-headers:
              - "Authorization"
              - "Content-Type"
              - "Accept"
              - "X-Requested-With"
            allow-credentials: true
            max-age: 3600
      server:
        webmvc:
          # ==========================================
          # MICROSERVICE ROUTING
          # ==========================================
          routes:
            - id: contract-service-route
              uri: ${CONTRACT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/contracts, /api/contracts/**

            - id: ai-service-route
              uri: ${AI_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/analysis, /api/analysis/**

            # ADMIN-only user administration, served by auth-service. Routed through the
            # gateway so the browser keeps a single origin and auth-service needs no extra
            # CORS surface; auth-service still enforces the ADMIN role independently.
            - id: auth-service-users-route
              uri: ${AUTH_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/users, /api/users/**

            # ==========================================
            # DOWNSTREAM HEALTH CHECK ROUTING
            # ==========================================
            - id: contract-service-health
              uri: ${CONTRACT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/health/contract
              filters:
                - SetPath=/actuator/health

            - id: ai-service-health
              uri: ${AI_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/health/ai
              filters:
                - SetPath=/actuator/health

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized

# Resource-server enforcement. Enforcing by default (Phase 7/8); AUTH_ENABLED=false is a
# documented emergency kill switch. See docs/AUTH_IMPLEMENTATION_PLAN.md sections 7 & 12.
app:
  security:
    enforce: ${AUTH_ENABLED:true}
    issuer-uri: ${AUTH_ISSUER_URI:http://localhost:8083}

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG