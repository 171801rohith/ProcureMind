server:
  port: 8080

spring:
  application:
    name: api-gateway
  servlet:
    multipart:
      max-file-size: 70MB
      max-request-size: 70MB
  cloud:
    gateway:
      server:
        webmvc:
          # ==========================================
          # MICROSERVICE ROUTING
          # ==========================================
          routes:
            - id: contract-service-route
              uri: ${CONTRACT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/contracts, /api/contracts/**

            - id: ai-service-route
              uri: ${AI_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/analysis, /api/analysis/**

            # ==========================================
            # DOWNSTREAM HEALTH CHECK ROUTING
            # ==========================================
            - id: contract-service-health
              uri: ${CONTRACT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/health/contract
              filters:
                - SetPath=/actuator/health

            - id: ai-service-health
              uri: ${AI_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/health/ai
              filters:
                - SetPath=/actuator/health

# ==========================================
# GATEWAY'S OWN ACTUATOR HEALTH
# ==========================================
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG