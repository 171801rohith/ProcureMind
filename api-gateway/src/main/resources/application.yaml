server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: contract-service-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/contracts/**
        - id: ai-service-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/analysis/**

# Expose basic health metrics
management:
  endpoints:
    web:
      exposure:
        include: health, info