server:
  port: 8081

spring:
  application:
    name: contract-service

  servlet:
    multipart:
      enabled: true
      max-file-size: 70MB
      max-request-size: 70MB

  # Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5433/procuremind_db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: validate # Automatically creates tables for Day 1 testing
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Kafka Producer Configuration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: contract-processing-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    properties:
      spring.json.trusted.packages: "com.procuremind.*"
  # Disable Flyway for Day 1 testing
  flyway:
    enabled: true

  # OAuth2 Resource Server. The JWKS URL differs by how the service is run, so the value
  # lives in AUTH_JWK_SET_URI and the default here is the host/IDE one:
  #   - docker compose sets AUTH_JWK_SET_URI=http://auth-service:8083/oauth2/jwks (service DNS)
  #   - a plain `mvn spring-boot:run` or an IDE run uses this localhost default
  # The issuer is deliberately NOT derived from this URL: app.security.issuer-uri stays the
  # static browser-facing issuer in both modes, so the `iss` claim is validated identically.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:8083/oauth2/jwks}

# Resource-server enforcement toggle. See docs/AUTH_IMPLEMENTATION_PLAN.md sections 8 & 13.
app:
  security:
    enforce: ${AUTH_ENABLED:true}
    issuer-uri: ${AUTH_ISSUER_URI:http://localhost:8083}

# Swagger UI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:admin}
  secret-key: ${MINIO_SECRET_KEY:password}
  bucket: ${MINIO_BUCKET:procuremind-contracts}